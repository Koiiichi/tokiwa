[Unit]
Requires=user-2200.slice
BindsTo=nftables.service
After=nftables.service user-2200.slice
RequiresMountsFor=/srv/development/cache/rootless-engine /srv/development/state/workspaces/workbench
[Service]
Slice=user-2200.slice
Delegate=cpu cpuset io memory pids
MemoryMax=8G
MemorySwapMax=0
CPUQuota=300%
TasksMax=1024
