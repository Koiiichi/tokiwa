# Installed by install.sh --with-docker as cloud-workbench.service.d/docker.conf.
# Sessions reach only the rootless engine of cloud-containers, through a read-only bind of its socket.
[Unit]
Requires=user@2200.service cloud-workbench-docker-wait.service
After=user@2200.service cloud-workbench-docker-wait.service
[Service]
Environment=DOCKER_HOST=unix:///run/cloud-workbench/docker.sock
BindReadOnlyPaths=/run/user/2200/docker.sock:/run/cloud-workbench/docker.sock
